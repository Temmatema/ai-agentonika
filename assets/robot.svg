<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" width="640" height="720"
     role="img" aria-label="Иллюстрация ИИ-агента">
  <defs>
    <linearGradient id="headGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#eef1f5"/>
      <stop offset="100%" stop-color="#c8ced8"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f6f8fb"/>
      <stop offset="100%" stop-color="#dfe4ea"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#4b525c"/>
      <stop offset="100%" stop-color="#12161c"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#242c3a"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>
    <radialGradient id="eyeGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%"  stop-color="#f1e8ff"/>
      <stop offset="32%" stop-color="#b98cff"/>
      <stop offset="68%" stop-color="#7c3ff2"/>
      <stop offset="100%" stop-color="#43138f"/>
    </radialGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- тень под фигурой -->
  <ellipse cx="320" cy="702" rx="236" ry="20" fill="#000000" opacity="0.08"/>

  <!-- торс и плечи -->
  <path d="M112 720 C132 612 202 566 320 566 C438 566 508 612 528 720 Z" fill="url(#metalGrad)"/>
  <path d="M238 720 C248 642 276 612 320 612 C364 612 392 642 402 720 Z" fill="#2a303a" opacity="0.75"/>

  <!-- шея -->
  <path d="M276 446 L364 446 L372 578 L268 578 Z" fill="url(#metalGrad)"/>
  <rect x="260" y="500" width="120" height="18" rx="9" fill="#0a0c10" opacity="0.5"/>
  <rect x="260" y="530" width="120" height="12" rx="6" fill="#0a0c10" opacity="0.38"/>

  <!-- голова -->
  <ellipse cx="320" cy="278" rx="184" ry="208" fill="url(#headGrad)"/>
  <ellipse cx="320" cy="286" rx="150" ry="172" fill="url(#faceGrad)"/>

  <!-- боковые панели -->
  <rect x="118" y="240" width="44" height="104" rx="20" fill="url(#metalGrad)"/>
  <rect x="478" y="240" width="44" height="104" rx="20" fill="url(#metalGrad)"/>

  <!-- швы на "щеках" -->
  <rect x="216" y="352" width="10" height="76" rx="5" fill="#c2c9d3"/>
  <rect x="414" y="352" width="10" height="76" rx="5" fill="#c2c9d3"/>

  <!-- визор -->
  <circle cx="320" cy="288" r="104" fill="url(#visorGrad)"/>
  <circle cx="320" cy="288" r="104" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="6"/>

  <!-- свечение глаза -->
  <circle cx="320" cy="288" r="64" fill="#8b5cf6" opacity="0.5" filter="url(#glow)"/>
  <circle cx="320" cy="288" r="58" fill="url(#eyeGrad)"/>
  <circle cx="320" cy="288" r="58" fill="none" stroke="#c4b5fd" stroke-width="3" opacity="0.9"/>
  <circle cx="320" cy="288" r="30" fill="#ffffff" opacity="0.85"/>
  <circle cx="320" cy="288" r="15" fill="#ffffff"/>

  <!-- линия "подбородка" -->
  <path d="M258 404 q62 30 124 0" fill="none" stroke="#b7bec8" stroke-width="5" stroke-linecap="round"/>

  <!-- блик сверху -->
  <path d="M222 152 C262 120 378 120 418 152" fill="none" stroke="#ffffff"
        stroke-width="10" stroke-linecap="round" opacity="0.75"/>
</svg>
